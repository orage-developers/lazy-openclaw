name: Release

# Tag format: <plugin>-v<semver>, for example `lazy-loading-v0.1.0`.
on:
  push:
    tags: ["*-v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release (e.g. lazy-loading-v0.1.0)"
        required: true

permissions:
  contents: write
  id-token: write # npm provenance

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      HAS_NPM_TOKEN: ${{ secrets.NPM_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Resolve plugin and version from tag
        id: meta
        run: |
          plugin="${TAG%-v*}"
          version="${TAG##*-v}"
          dir="plugins/${plugin}"
          if [ ! -f "${dir}/package.json" ]; then
            echo "::error::No plugin at ${dir} for tag ${TAG}"
            exit 1
          fi
          pkg_version="$(node -p "require('./${dir}/package.json').version")"
          if [ "${pkg_version}" != "${version}" ]; then
            echo "::error::Tag version ${version} does not match ${dir}/package.json version ${pkg_version}"
            exit 1
          fi
          echo "plugin=${plugin}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "dir=${dir}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: "24.x"
          cache: npm
          cache-dependency-path: ${{ steps.meta.outputs.dir }}/package-lock.json
          registry-url: https://registry.npmjs.org

      - name: Install, verify and pack
        working-directory: ${{ steps.meta.outputs.dir }}
        run: |
          npm ci
          npm run typecheck
          npm run build
          npm test
          npm run validate
          npm pack

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${TAG}" ${{ steps.meta.outputs.dir }}/*.tgz \
            --title "${{ steps.meta.outputs.plugin }} v${{ steps.meta.outputs.version }}" \
            --generate-notes \
            --verify-tag

      - name: Publish to npm
        if: ${{ env.HAS_NPM_TOKEN == 'true' }}
        working-directory: ${{ steps.meta.outputs.dir }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --provenance --access public
